name: Marketing Static Site CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nen1090-marketing-static-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required static assets
        run: |
          set -e
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f _headers
          test -f _redirects
          test -f assets/css/site.css
          test -f assets/js/site.js

      - name: Check root html pages include viewport and CSS
        run: |
          set -e
          for file in *.html; do
            grep -q 'name="viewport"' "$file" || (echo "$file missing viewport" && exit 1)
            grep -q 'assets/css/site.css' "$file" || (echo "$file missing stylesheet" && exit 1)
          done

      - name: Validate canonical sitemap routes
        run: |
          set -e
          grep -q 'weldinspectpro.com/platform' sitemap.xml
          grep -q 'weldinspectpro.com/inspections' sitemap.xml
          grep -q 'weldinspectpro.com/reports' sitemap.xml
          grep -q 'weldinspectpro.com/standards' sitemap.xml
          grep -q 'weldinspectpro.com/pricing' sitemap.xml
          grep -q 'weldinspectpro.com/nl/lasinspectie-software' sitemap.xml
          grep -q 'weldinspectpro.com/nl/en-1090-software' sitemap.xml
          grep -q 'weldinspectpro.com/nl/ce-dossier-software' sitemap.xml

      - name: Check for broken legacy header text
        run: |
          set -e
          if grep -R "WeldInspectWeld" -n . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=node_modules \
            --exclude-dir=dist; then
            echo "Broken concatenated header text found"
            exit 1
          fi
