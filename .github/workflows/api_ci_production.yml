name: Marketing Static Site CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nen1090-marketing-static-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -e
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f _headers
          test -f _redirects
          test -f assets/css/site.css
          test -f assets/js/site.js
          test -f assets/images/industrial-strip.jpeg

      - name: Validate important pages exist
        run: |
          set -e
          for file in \
            platform.html \
            inspections.html \
            reports.html \
            standards.html \
            pricing.html \
            resources.html \
            trial.html \
            demo.html \
            security.html \
            use-cases.html \
            case-studies.html \
            weld-inspection-software.html \
            welding-compliance.html \
            inspection-reporting.html \
            welding-standards.html \
            en-1090.html \
            iso-3834.html \
            iso-5817.html \
            aws-d1-1.html \
            asme-ix.html \
            api-1104.html; do
            test -f "$file" || (echo "Missing $file" && exit 1)
          done

      - name: Check for broken legacy header text
        run: |
          set -e
          if grep -R "WeldInspectWeld" -n . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=node_modules \
            --exclude-dir=dist; then
            echo "Broken concatenated header text found"
            exit 1
          fi

      - name: Check HTML pages include viewport and CSS
        run: |
          set -e
          for file in *.html; do
            grep -q 'name="viewport"' "$file" || (echo "$file missing viewport" && exit 1)
            grep -q 'assets/css/site.css' "$file" || (echo "$file missing stylesheet" && exit 1)
          done

      - name: Validate sitemap contains core SEO pages
        run: |
          set -e
          grep -q 'weld-inspection-software.html' sitemap.xml
          grep -q 'inspection-reporting.html' sitemap.xml
          grep -q 'welding-compliance.html' sitemap.xml
          grep -q 'welding-standards.html' sitemap.xml
          grep -q 'standards.html' sitemap.xml
          grep -q 'pricing.html' sitemap.xml
