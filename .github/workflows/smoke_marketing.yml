name: Smoke Test Marketing

on:
  workflow_run:
    workflows: ["Deploy Marketing to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check homepage
        run: curl -fL "https://nen1090-marketing.pages.dev/" || exit 1

      - name: Check onboarding page
        run: curl -fL "https://nen1090-marketing.pages.dev/onboarding" || exit 1

      - name: Check app login CTA exists
        run: |
          curl -fsSL "https://nen1090-marketing.pages.dev/" | grep -q "https://app.weldinspectpro.com/login"

      - name: Ensure homepage does not reference legacy marketing-new
        run: |
          if curl -fsSL "https://nen1090-marketing.pages.dev/" | grep -q "nen1090-marketing-new"; then
            echo "ERROR: legacy marketing-new reference found on homepage"
            exit 1
          fi

      - name: Ensure onboarding page does not reference legacy marketing-new
        run: |
          if curl -fsSL "https://nen1090-marketing.pages.dev/onboarding" | grep -q "nen1090-marketing-new"; then
            echo "ERROR: legacy marketing-new reference found on onboarding page"
            exit 1
          fi

      - name: Ensure marketing does NOT host login anymore
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nen1090-marketing.pages.dev/app/login")
          echo "Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "ERROR: marketing still hosts login"
            exit 1
          fi

      - name: Check auth reset redirect goes to app
        run: |
          LOCATION=$(curl -sI "https://nen1090-marketing.pages.dev/auth?token=test&mode=reset-password" | awk -F': ' '/^[Ll]ocation:/{print $2}' | tr -d '\r')
          echo "Location: $LOCATION"
          echo "$LOCATION" | grep -q "^https://app.weldinspectpro.com/reset-password?token=test$"

      - name: Check auth activate redirect goes to app
        run: |
          LOCATION=$(curl -sI "https://nen1090-marketing.pages.dev/auth?token=test&mode=activate" | awk -F': ' '/^[Ll]ocation:/{print $2}' | tr -d '\r')
          echo "Location: $LOCATION"
          echo "$LOCATION" | grep -q "^https://app.weldinspectpro.com/activate-account?token=test$"

      - name: Check robots.txt
        run: curl -fL "https://nen1090-marketing.pages.dev/robots.txt" || exit 1
