<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Close-up of inspected weld seam</title>
  <desc id="desc">Photo-style custom visual showing a close-up weld seam with blue inspection markers, material plate texture and audit evidence labels.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef4fb"/>
      <stop offset=".38" stop-color="#c8d3e2"/>
      <stop offset=".76" stop-color="#8ea0b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="weld" x1="0" x2="1">
      <stop stop-color="#334155"/>
      <stop offset=".22" stop-color="#94a3b8"/>
      <stop offset=".52" stop-color="#475569"/>
      <stop offset=".78" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .09"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1400" height="920" rx="42" fill="#f8fafc"/>
  <rect x="86" y="114" width="1228" height="650" rx="38" fill="url(#plate)" filter="url(#shadow)"/>
  <rect x="86" y="114" width="1228" height="650" rx="38" fill="#fff" filter="url(#grain)"/>
  <path d="M120 460h1160" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="18 18" opacity=".65"/>
  <path d="M158 462c78-64 150-64 228 0s150 64 228 0 150-64 228 0 150 64 228 0 150-64 228 0" fill="none" stroke="#253244" stroke-width="96" stroke-linecap="round" opacity=".35"/>
  <path d="M156 450c78-64 150-64 228 0s150 64 228 0 150-64 228 0 150 64 228 0 150-64 228 0" fill="none" stroke="url(#weld)" stroke-width="72" stroke-linecap="round"/>
  <path d="M158 450c78-64 150-64 228 0s150 64 228 0 150-64 228 0 150 64 228 0 150-64 228 0" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" opacity=".45"/>
  <g filter="url(#shadow)">
    <rect x="176" y="206" width="212" height="84" rx="22" fill="#fff" stroke="#2563eb" stroke-width="4"/>
    <text x="222" y="258" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="900" fill="#2563eb">VT OK</text>
    <path d="M388 248l196 122" stroke="#2563eb" stroke-width="4"/>
    <circle cx="590" cy="374" r="14" fill="#2563eb"/>
    <rect x="934" y="556" width="238" height="84" rx="22" fill="#fff" stroke="#2563eb" stroke-width="4"/>
    <text x="990" y="608" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="900" fill="#2563eb">W-1056</text>
    <path d="M934 596l-190-116" stroke="#2563eb" stroke-width="4"/>
    <circle cx="738" cy="476" r="14" fill="#2563eb"/>
  </g>
  <g transform="translate(470 772)" filter="url(#shadow)">
    <rect width="460" height="76" rx="24" fill="#fff"/>
    <circle cx="46" cy="38" r="14" fill="#16a34a"/>
    <text x="76" y="47" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#0f172a">Audit-ready weld evidence</text>
  </g>
</svg>
