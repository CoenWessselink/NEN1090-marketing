    <path d="M52 300c34-134 132-216 262-216 168 0 282 130 266 306l-228 8c14-94-20-158-88-178-80-22-138 28-166 114z" fill="#111827"/>
    <path d="M112 260c40-78 110-116 190-96 68 16 112 66 124 142l-244 8z" fill="#2563eb"/>
    <rect x="104" y="296" width="336" height="116" rx="26" fill="#020617"/>
    <rect x="200" y="330" width="140" height="38" rx="10" fill="#93c5fd"/>
    <path d="M106 410c-98 66-164 148-200 246" stroke="#1f2937" stroke-width="54" stroke-linecap="round"/>
    <path d="M414 404c90 44 154 114 196 214" stroke="#1f2937" stroke-width="54" stroke-linecap="round"/>
    <path d="M-108 666h230M580 640h230" stroke="#0f172a" stroke-width="54" stroke-linecap="round"/>
