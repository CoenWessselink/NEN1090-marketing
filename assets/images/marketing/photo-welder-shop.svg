<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Welder working in a fabrication shop</title>
  <desc id="desc">Photo-style custom visual of an industrial welder creating a bright blue arc on a steel assembly in a fabrication shop.</desc>
  <defs>
    <linearGradient id="shop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset=".42" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="arc" cx=".62" cy=".62" r=".28">
      <stop stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#bfdbfe"/>
      <stop offset=".55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop stop-color="#dbe3ee"/>
      <stop offset=".42" stop-color="#8fa1b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .075"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1400" height="920" rx="42" fill="url(#shop)"/>
  <rect width="1400" height="920" rx="42" fill="#fff" opacity=".04" filter="url(#grain)"/>
  <g opacity=".28" stroke="#e2e8f0" stroke-width="3">
    <path d="M110 168h1180M140 230h1060M182 292h928"/>
    <path d="M230 120v570M490 92v610M820 88v610M1110 140v540"/>
  </g>
  <g opacity=".22">
    <rect x="72" y="620" width="1256" height="92" rx="18" fill="#e2e8f0"/>
    <rect x="208" y="548" width="724" height="92" rx="14" fill="#cbd5e1"/>
    <rect x="918" y="526" width="210" height="126" rx="18" fill="#94a3b8"/>
  </g>
  <rect x="158" y="654" width="1040" height="82" rx="20" fill="url(#steel)"/>
  <path d="M218 694h900" stroke="#334155" stroke-width="16" stroke-linecap="round" opacity=".75"/>
  <circle cx="830" cy="588" r="236" fill="url(#arc)"/>
  <circle cx="810" cy="596" r="42" fill="#fff" opacity=".95"/>
  <path d="M760 594c64 38 126 36 188-8" fill="none" stroke="#60a5fa" stroke-width="18" stroke-linecap="round"/>
