    <path d="M894 548l124-42-82 100z"/>
    <path d="M742 658l-110 62 62-110z"/>
  </g>
  <g transform="translate(920 118)">
    <rect width="296" height="82" rx="22" fill="#fff" opacity=".94"/>
    <circle cx="38" cy="41" r="12" fill="#16a34a"/>
    <text x="62" y="48" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="900" fill="#0f172a">Live weld evidence</text>
