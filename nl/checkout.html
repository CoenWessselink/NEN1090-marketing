<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | WeldInspectPro</title><link rel="stylesheet" href="/assets/css/billing-flow.css"></head><body><main class="wrap"><h1>Abonnement starten</h1><div class="steps"><span class="step active" data-step-dot="1">Account</span><span class="step" data-step-dot="2">Bedrijf</span><span class="step" data-step-dot="3">Abonnement</span><span class="step" data-step-dot="4">Akkoord</span></div><form id="checkoutForm" class="card"><section data-step="1"><h2>Accountgegevens</h2><div class="form-grid"><label>Voornaam<input name="first_name" required></label><label>Achternaam<input name="last_name" required></label><label>E-mail<input name="email" type="email" required></label><label>Wachtwoord<input name="password" type="password" minlength="8" required></label></div></section><section data-step="2" class="hidden"><h2>Bedrijfsgegevens</h2><div class="form-grid"><label>Juridische bedrijfsnaam<input name="legal_name" required></label><label>Factuur e-mail<input name="billing_email" type="email" required></label><label>Straat<input name="street" required></label><label>Huisnummer<input name="house_number" required></label><label>Postcode<input name="postal_code" required></label><label>Plaats<input name="city" required></label><label>Land<select name="country"><option value="NL">Nederland</option><option value="BE">België</option><option value="DE">Duitsland</option></select></label><label>KvK<input name="kvk_number"></label><label>BTW nummer<input name="vat_number"></label></div></section><section data-step="3" class="hidden"><h2>Abonnement</h2><div class="form-grid"><label>Betaalperiode<select name="billing_cycle"><option value="monthly">Maandelijks</option><option value="yearly">Jaarlijks</option></select></label><label>Aantal gebruikers<input name="seats" type="number" min="1" value="1" required></label></div><div id="priceSummary" class="summary"></div></section><section data-step="4" class="hidden"><h2>Akkoord en betalen</h2><label><input type="checkbox" name="accepted_terms" required> Ik ga akkoord met de <a href="/nl/algemene-voorwaarden.html" target="_blank">algemene voorwaarden</a>.</label><label><input type="checkbox" name="accepted_direct_debit" required> Ik ga akkoord met automatische incasso / terugkerende betaling.</label><div id="checkoutMessage"></div></section><div style="display:flex;gap:10px;margin-top:20px"><button type="button" class="btn secondary" id="prevBtn">Vorige</button><button type="button" class="btn" id="nextBtn">Volgende</button><button type="submit" class="btn hidden" id="submitBtn">Naar Mollie</button></div></form></main><script src="/assets/js/billing-checkout.js"></script>

</nav>
</body></html>
