<!DOCTYPE html>
<html>
<head>
    <title>Onboarding</title>
</head>
<body>
<form id="trialForm">
    <input name="company" placeholder="Company">
    <input name="work_email" placeholder="Email">
    <input name="contact_name" placeholder="Name">
    <input name="seats" type="number" value="1">
    <select name="plan">
        <option value="professional">Professional</option>
    </select>
    <input name="trial_days" type="number" value="14">
    <textarea name="notes"></textarea>
    <button type="submit">Start trial</button>
</form>

<script src="/assets/js/trial-signup.js"></script>
</body>
</html>
