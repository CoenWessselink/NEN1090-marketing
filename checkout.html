<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | WeldInspect Pro</title><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/conversion-pro.css"></head><body><main><section class="section checkout-shell"><div class="container conversion-grid"><div class="glass-card conversion-panel"><div class="checkout-hero"><h1>Start your workspace.</h1><p class="lead">Create your WeldInspectPro environment, configure seats and complete payment securely via Mollie.</p></div><div class="billing-toggle"><button id="monthly">Monthly</button><button id="yearly" class="is-active">Yearly</button></div><div class="plan-choice is-active"><strong>Professional</strong><span id="priceText">€490 / user / year</span></div><div class="checkout-form-grid"><div class="field"><label>Company</label><input id="company"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Contact name</label><input id="name"></div><div class="field"><label>Seats</label><input id="seats" type="number" value="3" min="1"></div><div class="field full-span checkbox-row"><input type="checkbox" id="terms" checked><label for="terms">I agree to terms and recurring billing</label></div></div><div class="conversion-summary"><div class="conversion-summary-row"><span>Total</span><strong id="total" class="checkout-total">€1470</strong></div></div><button id="checkoutBtn" class="btn btn-primary full">Continue to payment <span class="conversion-spinner"></span></button><div class="conversion-success" id="success">Redirecting to secure payment...</div><div class="conversion-error" id="error"></div><div class="checkout-secure"><span>Secure payment</span><span>EU hosted</span><span>No hidden fees</span></div></div><div class="conversion-proof"><div><strong>2 min</strong><span>Setup time</span></div><div><strong>Instant</strong><span>Access</span></div><div><strong>Secure</strong><span>Mollie payments</span></div></div></div></section></main><script>const seatsEl=document.getElementById('seats');const totalEl=document.getElementById('total');const yearlyBtn=document.getElementById('yearly');const monthlyBtn=document.getElementById('monthly');const priceText=document.getElementById('priceText');const btn=document.getElementById('checkoutBtn');let cycle='yearly';function calc(){const seats=Number(seatsEl.value||1);const price=cycle==='yearly'?490:49;totalEl.textContent='€'+(price*seats);priceText.textContent=cycle==='yearly'?'€490 / user / year':'€49 / user / month'}seatsEl.oninput=calc;yearlyBtn.onclick=()=>{cycle='yearly';yearlyBtn.classList.add('is-active');monthlyBtn.classList.remove('is-active');calc()};monthlyBtn.onclick=()=>{cycle='monthly';monthlyBtn.classList.add('is-active');yearlyBtn.classList.remove('is-active');calc()};btn.onclick=async()=>{btn.classList.add('is-loading');const body={company_name:document.getElementById('company').value,contact_name:document.getElementById('name').value,email:document.getElementById('email').value,seat_count:Number(seatsEl.value||1),billing_cycle:cycle,accepted_terms:true,accepted_recurring_payment:true};const res=await fetch('/api/v1/public/checkout/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(data.checkout_url){window.location.href=data.checkout_url}else{document.getElementById('error').classList.add('is-visible');document.getElementById('error').textContent='Payment could not start';btn.classList.remove('is-loading')}};calc();</script></body></html>
